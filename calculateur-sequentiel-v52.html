<!-- v45.0 - Interface éclaircie, écran d'accueil pédagogique, métriques déplacées dans Données, lien de partage en lecture seule, liste « Mes tests ». v44.0 - Bornes calculées sur le trafic réel de chaque semaine (corrélations entre lectures), dépense des risques selon le calendrier du plan, futilité située par rapport au trafic prévu quand il est renseigné. v43.0 - Bornes séquentielles calculées dans le navigateur (plus d'appel au serveur, sauf secours). v42.0 - Fiabilité : garde-fous corrigés entre eux (régression à alpha/g), intervalle sur le log-ratio aux bornes d'efficacité seule, alerte « À surveiller » à Z <= -1,90, contrôle du trafic irrégulier, marge démontrable. Interface allégée : axe commun, détail au survol, vert #1D9E75. v41.1 - Vérification indépendante : secondaires à alpha/(2m), variance de la non-infériorité corrigée. v41.0 - Passe design validée sur maquette ; bornes d'efficacité seule pour les garde-fous, Bonferroni pour les secondaires -->

  var dirty=planKey(p)!==planKey(state.plan)||p.startDate!==state.plan.startDate||(p.traffic||0)!==(state.plan.traffic||0)||(p.unit||'semaine')!==(state.plan.unit||'semaine'),base=mdeBase(),cb=base?null:contBase(),mf=base?function(w,f){return mdeAt(p,base,w,f);}:cb?function(w,f){return mdeC(p,cb,w,f);}:null;
  var h='<div class="card pcard"><div class="phead"><div><h3>Durée du test et effet détectable</h3><span class="hint">Réglez la durée, lisez tout de suite ce que le test pourra démontrer.</span></div></div><div class="psplit"><div class="pform">'

    +'<span class="hint">'+(ui.mde.auto?'Pré-rempli depuis vos données importées (métrique principale). ':'')+(state.plan.traffic>0?'Trafic prévu enregistré dans le plan : '+nf(state.plan.traffic)+' visiteurs par semaine. Il sert aussi à régler la futilité.':'Saisissez le trafic prévu puis appliquez le plan : il sert aussi à régler la futilité si le trafic réel est irrégulier.')+'</span>'
    +'<div class="rythme"><label>Lecture des résultats</label><select data-p="unit"'+(state.weeks.length?' disabled':'')+'>'+sel(p.unit||'semaine',[['semaine','Chaque \u0002 (recommandé)'],['jour','Chaque jour']])+'</select><span class="hint">'+(state.weeks.length?'Le rythme se choisit avant le premier import.':p.unit==='jour'?'Vous importez un cumul par jour et l\'outil peut conclure chaque jour à partir du jour 7. En contrepartie, l\'effet minimal détectable augmente, et une décision peut tomber sur une \u0002 incomplète.':'Passez à « chaque jour » pour pouvoir conclure quelques jours plus tôt, au prix d\'un effet minimal détectable plus élevé.')+'</span></div>'
    +'<div class="form2"><div><label>Durée prévue (semaines)</label><input type="number" min="1" max="50" data-p="k" value="'+p.k+'"></div><div><label>Date de début</label><input type="date" data-p="startDate" value="'+esc(p.startDate)+'"></div>'
    +'<div><label>Confiance</label><select data-p="alpha">'+sel(p.alpha,[[0.2,'80 %'],[0.15,'85 %'],[0.1,'90 %'],[0.05,'95 %'],[0.01,'99 %']])+'</select></div><div><label>Puissance</label><select data-p="power">'+sel(p.power,[[0.6,'60 %'],[0.7,'70 %'],[0.8,'80 %'],[0.85,'85 %'],[0.9,'90 %'],[0.95,'95 %']])+'</select></div></div>'
    +'<div><label>Quand le test peut-il s\'arrêter avant la fin ?</label>'
    +'<label class="opt'+(p.testType===3?' on':'')+'"><input type="radio" name="gst-tt" data-p="testType" value="3"'+(p.testType===3?' checked':'')+'><span><b>Dès que le résultat est joué</b> · recommandé<br><span class="hint">Le test s\'arrête s\'il gagne, ou s\'il n\'a plus de chances de gagner.</span><span class="pc"><span class="pro">Vous libérez le trafic des tests sans avenir</span><span class="con">L\'arrêt demandé par l\'outil doit être respecté</span></span></span></label>'
    +'<label class="opt'+(p.testType===1?' on':'')+'"><input type="radio" name="gst-tt" data-p="testType" value="1"'+(p.testType===1?' checked':'')+'><span><b>Seulement s\'il gagne</b><br><span class="hint">Sinon le test va au bout de la durée prévue.</span><span class="pc"><span class="pro">Toutes les données, même sur un test neutre</span><span class="con">Un test sans avenir occupe le trafic jusqu\'à la fin</span></span></span></label></div>'
    +(ui.adv?'<div class="form2"><div><label>Dépense du risque α (efficacité)</label><select data-p="sfu">'+sel(p.sfu,[['KimDeMets','Kim-DeMets (ρ = 3)'],['OF','O\'Brien-Fleming']])+'</select></div><div><label>Dépense du risque β (futilité)</label><select data-p="sfl">'+sel(p.sfl,[['HSD','HSD (γ = −2)'],['KimDeMets','Kim-DeMets (ρ = 3)'],['OF','O\'Brien-Fleming']])+'</select></div></div>':'')
    +'<p class="row"><button type="button" class="pri" data-act="applyplan"'+(dirty?'':' disabled')+'>Appliquer le plan</button><button type="button" class="link" data-act="adv">'+(ui.adv?'Masquer les':'Afficher les')+' réglages avancés</button></p></div><div class="pmde">';
  h+='<div class="kicker" style="color:#0E7C5D">Ce que ce plan peut démontrer</div>';
  if(!mf)h+='<p>Renseignez le trafic et les conversions par semaine pour connaître le plus petit effet que ce test pourra démontrer.</p>';
  else{
    var IF=needIF(p,p.k),fix=mf(p.k),seq=typeof IF==='number'?mf(p.k,Math.sqrt(IF)):null,val=seq||fix;
    h+='<div class="mdebig"><span class="num">'+nf(val*100,2)+' %</span><span><b>Effet minimal détectable</b><br>en '+p.k+' semaine'+(p.k>1?'s':'')+' de test'+(seq?'':' <span class="hint">('+(IF===false?'horizon fixe, calcul séquentiel indisponible':'calcul séquentiel en cours…')+')</span>')+'</span></div>'

      +(seq&&IF>1.0005?'<p class="hint">Dont '+pct(seq/fix-1,1)+' dus au suivi chaque semaine : le même test lu une seule fois à la fin détecterait '+nf(fix*100,2)+' %.</p>':'');
    var ks=(p.unit==='jour'?[7,14,21,28,35,42,p.k]:[2,4,6,8,10,12,p.k]).filter(function(v,i,a){return v>=1&&v<=50&&a.indexOf(v)===i;}).sort(function(a,b){return a-b;}),rows=ks.map(function(w){var f=needIF(p,w),v=mf(w,typeof f==='number'?Math.sqrt(f):1);return {w:w,ok:typeof f==='number',v:v};}),mxv=Math.max.apply(null,rows.map(function(r){return r.v;}));
    h+='<div class="mdetab"><div class="mh">Et avec une autre durée ?</div>'+rows.map(function(r){return '<button type="button" class="mr2'+(r.w===p.k?' on':'')+'" data-act="pickk" data-v="'+r.w+'" role="radio" aria-checked="'+(r.w===p.k)+'"><span class="rd"></span><span>'+r.w+' semaine'+(r.w>1?'s':'')+'</span><span class="b"><i style="width:'+Math.max(4,r.v/mxv*100)+'%"></i></span><b class="num">'+(r.ok?'':'≈ ')+nf(r.v*100,2)+' %</b></button>';}).join('')+'</div><span class="hint">« ≈ » : valeur à horizon fixe, remplacée dès que le calcul séquentiel répond. Choisissez une durée pour la retenir, puis appliquez le plan.</span>';
  }
  h+='</div></div></div>';
  return h;
}
function render(){
  var a=document.activeElement,fsel='';
  if(a&&root.contains(a)&&a!==root)['data-f','data-d','data-dm','data-p','data-m','data-mde','data-i','data-act','data-v'].forEach(function(k){if(a.hasAttribute(k))fsel+='['+k+'="'+a.getAttribute(k)+'"]';});
  root.innerHTML=finalize(head()+(ui.ro?viewResults():ui.tab==='donnees'?viewData():ui.tab==='plan'?viewPlan():viewResults())+(state.weeks.length&&(ui.ro||ui.tab==='resultats')?'<p class="help">Un doute sur la lecture de ce résultat ? <a href="https://fwoptimisation.com/fwo-consultant-cro-contact/" target="_blank" rel="noopener">Parlez-en à Mathieu Fauveaux, consultant CRO</a></p>':'')+'<div class="foot"><span>Analyse séquentielle par groupes · calcul dans le navigateur · '+VERSION+'</span><a href="https://fwoptimisation.com/fwo-consultant-cro-contact/" target="_blank" rel="noopener">Contacter FWOptimisation</a><span class="logo"><b>FWO</b>ptimisation</span></div>',(ui.tab==='plan'&&ui.planDraft&&!ui.ro?ui.planDraft.unit:state.plan.unit)==='jour');
  drawCharts();
  if(fsel){var el=null;try{el=root.querySelector(fsel);}catch(e){}if(el&&!el.disabled)el.focus({preventScroll:true});}
}
function drawCharts(){
  var el=root.querySelector('[data-chart]');if(!el||!state.bounds)return;
  var m=state.metrics.filter(function(x){return x.id===el.getAttribute('data-chart');})[0];if(!m)return;
  el.innerHTML=finalize(seqChart(m,compute(),+el.getAttribute('data-cur'),Math.max(260,Math.floor(el.clientWidth))),U());
}
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,150);});

/* ---------- événements ---------- */
function act(name,v,el){
  ui.notice='';
  if(name==='tab'){ui.tab=v;ui.error='';if(v!=='plan')ui.planDraft=null;}
  else if(name==='pick'){var fi=root.querySelector('[data-f=file]');if(fi)fi.click();return;}
  else if(name==='example'){openDraft(EXEMPLE,'exemple-7-metriques.csv');if(ui.draft){ui.draft.k=8;ui.draft.name='Exemple : 7 métriques';render();}return;}
  else if(name==='template'){return download('modele-import-sequentiel.csv',toCSV([['Semaine','Date de début','Date de fin','Variation','Visiteurs','Visiteurs convertis (principal)','Visiteurs avec rebond','CA (€) [somme]','CA (€) [somme carrés]'],['1','2026-01-05','2026-01-11','A - Contrôle','','','','',''],['1','2026-01-05','2026-01-11','B - Variante','','','','','']]));}
  else if(name==='export'){var rows=[['Semaine','Variation','Visiteurs'].concat([].concat.apply([],state.metrics.map(function(m){return m.type==='continue'?[m.name+' [somme]',m.name+' [somme carrés]']:[m.name];})))];
    state.weeks.forEach(function(w,i){['A','B'].forEach(function(s){rows.push([i+1,state.labels[s],w[s].n].concat([].concat.apply([],state.metrics.map(function(m){var x=w[s].m[m.id]||{};return m.type==='continue'?[String(x.s).replace('.',','),String(x.ss).replace('.',',')]:[x.c];}))));});});
    return download((state.name||'test')+'-donnees.csv',toCSV(rows));}
  else if(name==='apply'){return applyDraft();}
  else if(name==='cancel'){ui.draft=null;}
  else if(name==='week'){ui.week=+v;}
  else if(name==='legend'){ui.legend=!ui.legend;}
  else if(name==='detail'){ui.detail=!ui.detail;}
  else if(name==='unit'){ui.unit=v;}
  else if(name==='howto'){ui.howto=v;}
  else if(name==='goimport'){var gi=root.querySelector('#gst-import');if(gi)gi.scrollIntoView({behavior:'smooth',block:'start'});return;}
  else if(name==='dsub'){ui.dsub=v;}
  else if(name==='manadd'){if(ui.man.ms.length<5)ui.man.ms.push({name:'',role:'garde-fou'});}
  else if(name==='manstart'){var mm=ui.man,kk=parseInt(mm.k,10),list=mm.ms.filter(function(x,i){return i===0||x.name.trim();});
    if(!mm.ms[0].name.trim()){ui.error='Donnez un nom à l\'objectif principal.';return render();}
    if(!(kk>=1&&kk<=50)){ui.error='Durée invalide (1 à 50 semaines).';return render();}
    state=freshState();state.name=mm.name.trim()||'Test saisi à la main';state.plan.k=kk;state.plan.beta=parseFloat((1-state.plan.power).toFixed(4));
    state.metrics=list.map(function(x,i){var nm=x.name.trim();return {id:uid(),src:'',name:nm,type:'binaire',role:i?x.role:'principale',sens:/rebond|sortie|abandon|erreur|retour|contact|désabonn/i.test(nm)?'baisse':'hausse',marge:1};});
    ui.week=null;ui.sel=null;ui.draft=null;ui.planDraft=null;ui.error='';ui.notice='Test créé. Saisissez les chiffres cumulés de la semaine 1.';ui.tab='donnees';ui.manual=true;autosave();}
  else if(name==='faq'){ui.faq=ui.faq===v?'':v;}
  else if(name==='open'){return loadSaved(v);}
  else if(name==='share'){ui.share=!ui.share;ui.copied=false;if(ui.share){ui.shareUrl='';encodeShare().then(function(t){ui.shareUrl=shareBase()+'#t='+t;render();}).catch(function(e){ui.share=false;ui.error='Lien de partage impossible : '+e.message;render();});}}
  else if(name==='shareclose'){ui.share=false;}
  else if(name==='sharecopy'){var done=function(){ui.copied=true;render();};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ui.shareUrl).then(done,function(){var i=root.querySelector('[data-f=shareurl]');if(i){i.select();try{document.execCommand('copy');}catch(e){}}done();});}else{var i2=root.querySelector('[data-f=shareurl]');if(i2){i2.select();try{document.execCommand('copy');}catch(e){}}done();}return;}
  else if(name==='rocopy'){ui.ro=false;ui.roDate='';try{history.replaceState(null,'',shareBase());}catch(e){}ui.notice='Copie modifiable ouverte. Enregistrez-la pour la retrouver dans vos tests.';}
  else if(name==='sel'){ui.sel=v;}
  else if(name==='manual'){ui.manual=!ui.manual;}
  else if(name==='adv'){ui.adv=!ui.adv;}
  else if(name==='pickk'){if(ui.planDraft)ui.planDraft.k=+v;}
  else if(name==='delweek'){if(!confirm(T('Supprimer les données de la semaine '+state.weeks.length+' ?')))return;state.weeks.pop();ui.week=null;autosave();}
  else if(name==='addweek'){return addManual();}
  else if(name==='save'){if(!state.name.trim()){ui.error='Donnez un nom au test avant de l\'enregistrer.';}else{autosave();if(!ui.error)ui.notice='Test « '+state.name+' » enregistré dans ce navigateur.';}}
  else if(name==='new'){if(state.weeks.length&&!confirm('Démarrer un nouveau test ? Les données non enregistrées seront perdues.'))return;state=freshState();ui.week=null;ui.sel=null;ui.draft=null;ui.planDraft=null;ui.error='';ui.tab='resultats';}
  else if(name==='applyplan'){var p=ui.planDraft;if(!(p.k>=1&&p.k<=50)){ui.error='Durée invalide (1 à 50 semaines).';return render();}
    if(p.k<state.weeks.length){ui.error='La durée ('+p.k+') est inférieure au nombre de semaines déjà saisies ('+state.weeks.length+').';return render();}
    if(state.weeks.length&&planKey(p)!==planKey(state.plan)&&!confirm('Modifier le plan recalcule les bornes sur les données déjà saisies. À réserver à la correction d\'une erreur de paramétrage. Continuer ?'))return;
    p.beta=parseFloat((1-p.power).toFixed(4));state.plan=p;ui.planDraft=null;ui.error='';ui.notice='Plan appliqué.';autosave();ensureBounds();}
  render();
}
function addManual(){
  var W={A:{n:NaN,m:{}},B:{n:NaN,m:{}}},errs=[];
  root.querySelectorAll('[data-mw]').forEach(function(i){var k=i.getAttribute('data-mw').split('|'),v=toNum(i.value);if(k[1]==='n')W[k[0]].n=v;else{(W[k[0]].m[k[1]]=W[k[0]].m[k[1]]||{})[k[2]]=v;}});
  var prev=state.weeks[state.weeks.length-1];
  ['A','B'].forEach(function(s){var o=W[s];if(!(o.n>0)||o.n!==Math.round(o.n))errs.push(state.labels[s]+' : visiteurs invalides.');if(prev&&o.n<prev[s].n)errs.push(state.labels[s]+' : visiteurs cumulés inférieurs à la semaine précédente.');
    state.metrics.forEach(function(m){var x=o.m[m.id]||{};if(m.type==='continue'){if(!isFinite(x.s)||!isFinite(x.ss))errs.push(state.labels[s]+' : « '+m.name+' » : valeurs manquantes.');}
      else if(!(x.c>=0)||x.c!==Math.round(x.c))errs.push(state.labels[s]+' : « '+m.name+' » : valeur invalide.');else if(x.c>o.n)errs.push(state.labels[s]+' : « '+m.name+' » dépasse les visiteurs.');else if(prev&&x.c<prev[s].m[m.id].c)errs.push(state.labels[s]+' : « '+m.name+' » : cumul inférieur à la semaine précédente.');});});
  if(state.weeks.length>=state.plan.k)errs.push('Durée prévue atteinte ('+state.plan.k+' semaines).');
  if(errs.length){ui.error=errs.slice(0,6).join(' ');return render();}
  state.weeks.push(W);ui.manual=false;ui.week=null;ui.error='';ui.tab='resultats';autosave();ensureBounds();render();
}
root.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||!root.contains(t)||t.tagName==='SELECT'||e.target.closest('select'))return;if(t.disabled)return;e.stopPropagation();act(t.getAttribute('data-act'),t.getAttribute('data-v'),t);});
root.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][tabindex]')){e.preventDefault();act(e.target.getAttribute('data-act'),e.target.getAttribute('data-v'),e.target);}});
function later(){setTimeout(render,0);}
root.addEventListener('change',function(e){
  var t=e.target,d=ui.draft;
  if(t.matches('[data-f=file]')){if(t.files[0])readFile(t.files[0]);return;}
  if(t.matches('[data-f=name]')){state.name=t.value.trim();return;}
  if(t.matches('[data-act=load]')){if(t.value)loadSaved(t.value);return;}
  if(t.matches('[data-act=weeksel]')){ui.week=+t.value;return later();}
  if(t.hasAttribute('data-d')&&d){var f=t.getAttribute('data-d');
    if(f==='cumulate')d.cumulate=t.checked;else if(f==='name')d.name=t.value;else if(f==='k')d.k=parseInt(t.value,10)||d.k;else if(f==='startDate')d.startDate=t.value;
    else{var keep={name:d.name,k:d.k,startDate:d.startDate,cVar:d.cVar,cVis:d.cVis,test:d.test,control:d.control,variant:d.variant},old=d.metrics,cum=d.cumulate;
      if(f==='cVar'||f==='cVis'){keep[f]=parseInt(t.value,10);if(f==='cVar'){keep.control=null;keep.variant=null;}}else keep[f]=t.value;
      if(f==='test'){keep.k=null;keep.startDate=null;keep.name=d.name===d.test?t.value:d.name;}
      ui.draft=analyze(ui.rawTable,d.file,keep);ui.draft.cumulate=cum;
      ui.draft.metrics.forEach(function(m){var o=old.filter(function(x){return x.src===m.src;})[0];if(o){m.include=o.include;m.role=o.role;m.sens=o.sens;m.name=o.name;}});}
    return later();}
  if(t.hasAttribute('data-dm')&&d){var m=d.metrics[+t.getAttribute('data-i')],g=t.getAttribute('data-dm');
    if(g==='include')m.include=t.checked;else m[g]=t.value;
    if(g==='role'&&t.value==='principale')d.metrics.forEach(function(x){if(x!==m&&x.role==='principale')x.role='secondaire';});
    return later();}
  if(t.hasAttribute('data-p')&&ui.planDraft){var k=t.getAttribute('data-p');if(k==='unit'&&t.value!==(ui.planDraft.unit||'semaine')){ui.planDraft.k=t.value==='jour'?Math.min(50,ui.planDraft.k*7):Math.max(1,Math.round(ui.planDraft.k/7));}ui.planDraft[k]=(k==='startDate'||k==='sfu'||k==='sfl'||k==='unit')?t.value:(k==='k'||k==='testType'?parseInt(t.value,10):parseFloat(t.value));return later();}
  if(t.hasAttribute('data-m')){var mm=state.metrics[+t.getAttribute('data-i')],q=t.getAttribute('data-m');
    if(q==='role'&&state.weeks.length&&!confirm('Changer le rôle d\'une métrique après avoir vu les résultats fausse la lecture du test. À réserver à la correction d\'une erreur. Continuer ?'))return later();
    mm[q]=q==='marge'?(parseFloat(t.value)>0?parseFloat(t.value):1):(q==='name'?(t.value.trim()||mm.name):t.value);
    if(q==='role'&&t.value==='principale')state.metrics.forEach(function(x){if(x!==mm&&x.role==='principale')x.role='secondaire';});
    autosave();if(q==='role')ensureBounds();return later();}
  if(t.hasAttribute('data-man')){var mk=t.getAttribute('data-man'),mx=/^m(\d)(name|role)$/.exec(mk);if(mx)ui.man.ms[+mx[1]][mx[2]]=t.value;else ui.man[mk]=t.value;return;}
  if(t.getAttribute('data-f')==='shareto'){ui.shareTo=t.value.trim();return later();}
  if(t.hasAttribute('data-mde')){ui.mde[t.getAttribute('data-mde')]=t.value;ui.mde.auto=false;if(t.getAttribute('data-mde')==='traffic'&&ui.planDraft){var tv=toNum(t.value);ui.planDraft.traffic=tv>0?tv:0;}return later();}
});
