<!-- v45.0 - Interface éclaircie, écran d'accueil pédagogique, métriques déplacées dans Données, lien de partage en lecture seule, liste « Mes tests ». v44.0 - Bornes calculées sur le trafic réel de chaque semaine (corrélations entre lectures), dépense des risques selon le calendrier du plan, futilité située par rapport au trafic prévu quand il est renseigné. v43.0 - Bornes séquentielles calculées dans le navigateur (plus d'appel au serveur, sauf secours). v42.0 - Fiabilité : garde-fous corrigés entre eux (régression à alpha/g), intervalle sur le log-ratio aux bornes d'efficacité seule, alerte « À surveiller » à Z <= -1,90, contrôle du trafic irrégulier, marge démontrable. Interface allégée : axe commun, détail au survol, vert #1D9E75. v41.1 - Vérification indépendante : secondaires à alpha/(2m), variance de la non-infériorité corrigée. v41.0 - Passe design validée sur maquette ; bornes d'efficacité seule pour les garde-fous, Bonferroni pour les secondaires -->

var BQ_SQL=[
"-- Test A/B : visiteurs cumulés depuis le premier jour, une ligne par variation.",
"DECLARE debut DATE DEFAULT DATE '2026-11-02';  -- premier jour du test",
"DECLARE fin   DATE DEFAULT DATE '2026-11-08';  -- dernier jour complet d'une semaine du test",
"",
"WITH expositions AS (",
"  SELECT",
"    user_pseudo_id,",
"    -- paramètre qui porte la variation",
"    (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'variation') AS variation,",
"    MIN(event_timestamp) AS premiere_exposition",
"  FROM `mon-projet.analytics_123456789.events_*`  -- votre table d'export GA4",
"  WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', debut) AND FORMAT_DATE('%Y%m%d', fin)",
"    AND user_pseudo_id IS NOT NULL",
"    AND event_name = 'ab_test'  -- événement envoyé à l'exposition",
"    AND (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'test') = 'nom-du-test'",
"  GROUP BY user_pseudo_id, variation",
"),",
"exclus AS (  -- visiteurs vus dans les deux variations : écartés, mais comptés",
"  SELECT COUNT(*) AS n FROM (",
"    SELECT user_pseudo_id FROM expositions WHERE variation IS NOT NULL",
"    GROUP BY user_pseudo_id HAVING COUNT(DISTINCT variation) > 1)",
"),",
"visiteurs AS (  -- un visiteur vu dans deux variations est écarté",
"  SELECT",
"    user_pseudo_id,",
"    ANY_VALUE(variation) AS variation,",
"    MIN(premiere_exposition) AS premiere_exposition",
"  FROM expositions",
"  WHERE variation IS NOT NULL",
"  GROUP BY user_pseudo_id",
"  HAVING COUNT(DISTINCT variation) = 1",
"),",
"objectifs AS (  -- après la première exposition seulement",
"  SELECT",
"    v.user_pseudo_id,",
"    MAX(IF(e.event_name = 'purchase', 1, 0)) AS achat,          -- vos objectifs",
"    MAX(IF(e.event_name = 'add_to_cart', 1, 0)) AS ajout_panier",
"  FROM visiteurs AS v",
"  JOIN `mon-projet.analytics_123456789.events_*` AS e",
"    ON e.user_pseudo_id = v.user_pseudo_id",
"  WHERE e._TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', debut) AND FORMAT_DATE('%Y%m%d', fin)",
"    AND e.event_timestamp >= v.premiere_exposition",
"  GROUP BY v.user_pseudo_id",
")",
"SELECT",
"  debut AS debut_test,",
"  fin AS fin_donnees,",
"  v.variation AS variation,",
"  COUNT(*) AS visiteurs,",
"  COUNTIF(o.achat = 1) AS visiteurs_avec_achat,",
"  COUNTIF(o.ajout_panier = 1) AS visiteurs_avec_ajout_panier,",
"  (SELECT n FROM exclus) AS exclus_deux_variations",
"FROM visiteurs AS v",
"LEFT JOIN objectifs AS o USING (user_pseudo_id)",
"GROUP BY variation",
"ORDER BY variation;"].join('\n');

      +'<label class="opt'+(tt===3?' on':'')+'"><input type="radio" name="'+nm+'" '+at+' value="3"'+(tt===3?' checked':'')+'><span><b>Dès que le résultat est joué</b> <span class="reco">Recommandé</span><br><span class="hint">Le test s\'arrête s\'il gagne, ou s\'il n\'a plus de chances de gagner.</span><span class="pc"><span class="pro">Vous libérez le trafic des tests sans avenir</span><span class="con">L\'arrêt demandé par l\'outil doit être respecté</span></span></span></label>'
      +'<label class="opt'+(tt===1?' on':'')+'"><input type="radio" name="'+nm+'" '+at+' value="1"'+(tt===1?' checked':'')+'><span><b>Seulement s\'il gagne</b><br><span class="hint">Sinon le test va au bout de la durée prévue.</span><span class="pc"><span class="pro">Toutes les données, même sur un test neutre</span><span class="con">Un test sans avenir occupe le trafic jusqu\'à la fin</span></span></span></label></div>';}

    :tab==='ga4'?step(1,'<b>Ouvrez Explorer</b> et créez une exploration « Format libre ».')+step(2,'<b>En lignes</b> : la dimension qui porte la variation du test. Elle doit être de portée utilisateur ; sinon un achat fait plus tard n\'est pas rattaché à la variation.')+step(3,'<b>En colonnes</b> : « Nom de l\'événement », limité à l\'événement d\'exposition de votre outil de test et à vos objectifs.')+step(4,'<b>En valeurs</b> : « Nombre total d\'utilisateurs ». La colonne de l\'événement d\'exposition donne les visiteurs exposés. N\'utilisez pas <code>session_start</code> : la session commence souvent avant l\'exposition.')+step(5,'<b>Période</b> : du premier jour du test à hier, puis exportez en CSV.')+'<p class="hint tnote">L\'exploration ne vérifie pas qu\'un objectif est atteint après la première exposition. Si la variation n\'est pas une propriété utilisateur, ou si cet ordre compte pour vous, passez par l\'onglet BigQuery.</p>'
    :tab==='adobe'?step(1,'<b>Ouvrez Analysis Workspace</b> et ajoutez un tableau à structure libre.')+step(2,'<b>En lignes</b> : la dimension qui porte la variation du test. Avec Analytics for Target, c\'est « Expériences Target », filtrée sur votre activité.')+step(3,'<b>En colonnes</b> : « Visiteurs uniques », puis une colonne « Visiteurs uniques » par objectif, restreinte par un segment aux visiteurs ayant réalisé l\'action.')+step(4,'<b>Période</b> : du premier jour du test à hier, en une seule période.')+step(5,'<b>Téléchargez le tableau en CSV</b> (clic droit sur le tableau) et déposez le fichier ici.')
    :tab==='bigquery'?step(1,'<b>Copiez la requête modèle</b> dans l\'éditeur BigQuery. Elle lit l\'export Google Analytics 4 (tables <code>events_*</code>).')+step(2,'<b>Adaptez les lignes commentées</b> : les deux dates, la table, l\'événement qui signale l\'exposition au test et ses paramètres, vos objectifs.')+step(3,'<b>Exécutez</b> : le résultat tient en une ligne par variation, en cumul depuis le premier jour.')+step(4,'<b>Enregistrez le résultat en CSV</b> et déposez le fichier ici. Les deux dates sont dans le fichier : rien à saisir.')+step(5,'<b>Chaque semaine</b>, changez seulement la date de fin et relancez la requête.')
    :step(1,'<b>Créez un rapport par variation</b> : une ligne pour le contrôle, une pour la variante.')+step(2,'<b>Ajoutez le nombre de visiteurs</b> (ou d\'utilisateurs) exposés à chaque variation.')+step(3,'<b>Ajoutez une colonne par objectif</b> : le nombre de visiteurs ayant réalisé l\'action, pas le nombre d\'actions.')+step(4,'<b>Période</b> : du premier jour du test à hier, en une seule période.')+step(5,'<b>Exportez en CSV</b>, ou remplissez le modèle à la main.');

    if(full.length>2000){full=head+encodeURIComponent(intro+'[collez ici le lien copié : Ctrl+V]\n');ui.mailNote='longko';var okc=function(){ui.mailNote='long';render();};try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ui.shareUrl).then(okc,function(){});else{var i4=root.querySelector('[data-f=shareurl]');if(i4){i4.select();if(document.execCommand('copy'))ui.mailNote='long';}}}catch(e){}}else ui.mailNote='ok';
    if(window.GST_NOMAIL)window.GST_NOMAIL(full);else location.href=full;render();return;}
  else if(name==='sharecopy'){var done=function(){ui.copied=true;render();};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ui.shareUrl).then(done,function(){var i=root.querySelector('[data-f=shareurl]');if(i){i.select();try{document.execCommand('copy');}catch(e){}}done();});}else{var i2=root.querySelector('[data-f=shareurl]');if(i2){i2.select();try{document.execCommand('copy');}catch(e){}}done();}return;}
  else if(name==='rocopy'){ui.ro=false;ui.roDate='';try{history.replaceState(null,'',shareBase());}catch(e){}ui.notice='Copie modifiable ouverte. Enregistrez-la pour la retrouver dans vos tests.';}
  else if(name==='sel'){ui.sel=v;}
  else if(name==='manual'){ui.manual=!ui.manual;}
  else if(name==='adv'){ui.adv=!ui.adv;}
  else if(name==='pickk'){if(ui.planDraft)ui.planDraft.k=+v;}
  else if(name==='delweek'){if(!confirm(T('Supprimer les données de la semaine '+WKL()+' ?')))return;state.weeks.pop();ui.week=null;autosave();}
  else if(name==='addweek'){return addManual();}
  else if(name==='save'){if(!state.name.trim()){ui.error='Donnez un nom au test avant de l\'enregistrer.';}else if(ACC.user){ui.error='';autosave();accSave();return;}else{autosave();if(!ui.error)ui.notice='Test « '+state.name+' » enregistré dans ce navigateur.';}}
  else if(name==='new'){if(state.weeks.length&&!confirm('Démarrer un nouveau test ? Les données non enregistrées seront perdues.'))return;state=freshState();ui.start=true;ui.api.open=false;ui.week=null;ui.sel=null;ui.draft=null;ui.planDraft=null;ui.error='';ui.tab='resultats';}
  else if(name==='applyplan'){var p=ui.planDraft;if(!(p.k>=1&&p.k<=50)){ui.error='Durée invalide (1 à 50 semaines).';return render();}
    if(p.k<WKL()){ui.error='La durée ('+p.k+') est inférieure à la semaine déjà atteinte ('+WKL()+').';return render();}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p.startDate||'')||p.startDate<'2000-01-01'||p.startDate>todayISO()){ui.error='Date de début invalide.';return render();}
    if(p.unit!=='jour'&&p.startDate!==state.plan.startDate&&state.weeks.some(function(x){return x.end;})){var nw=[],bad=false,pv=0;state.weeks.forEach(function(x,i){var c=x.end?Math.floor((dayDiff(p.startDate,x.end)+1)/7):Math.max(pv+1,x.wk||i+1);if(c<=pv||c<i+1||c>p.k)bad=true;nw.push(c);pv=c;});
      if(bad){ui.error='Cette date de début ne correspond pas aux lectures déjà importées (données jusqu\'au '+state.weeks.filter(function(x){return x.end;}).map(function(x){return frDate(x.end);}).join(', ')+') : chacune doit tomber sur une semaine complète différente, dans la durée prévue.';return render();}
      state.weeks.forEach(function(x,i){x.wk=nw[i];});}
    if(state.weeks.length&&planKey(p)!==planKey(state.plan)&&!confirm('Modifier le plan recalcule les bornes sur les données déjà saisies. À réserver à la correction d\'une erreur de paramétrage. Continuer ?'))return;
    p.beta=parseFloat((1-p.power).toFixed(4));state.plan=p;ui.planDraft=null;ui.error='';ui.notice='Plan appliqué.';autosave();ensureBounds();}
  render();
}
function addManual(){
  var W={A:{n:NaN,m:{}},B:{n:NaN,m:{}}},errs=[];
  root.querySelectorAll('[data-mw]').forEach(function(i){var k=i.getAttribute('data-mw').split('|'),v=toNum(i.value);if(k[1]==='n')W[k[0]].n=v;else{(W[k[0]].m[k[1]]=W[k[0]].m[k[1]]||{})[k[2]]=v;}});
  var prev=state.weeks[state.weeks.length-1];
  ['A','B'].forEach(function(s){var o=W[s];if(!(o.n>0)||o.n!==Math.round(o.n))errs.push(state.labels[s]+' : visiteurs invalides.');if(prev&&o.n<prev[s].n)errs.push(state.labels[s]+' : visiteurs cumulés inférieurs à la semaine précédente.');
    state.metrics.forEach(function(m){var x=o.m[m.id]||{};if(m.type==='continue'){if(!isFinite(x.s)||!isFinite(x.ss))errs.push(state.labels[s]+' : « '+m.name+' » : valeurs manquantes.');}
      else if(!(x.c>=0)||x.c!==Math.round(x.c))errs.push(state.labels[s]+' : « '+m.name+' » : valeur invalide.');else if(x.c>o.n)errs.push(state.labels[s]+' : « '+m.name+' » dépasse les visiteurs.');else if(prev&&x.c<prev[s].m[m.id].c)errs.push(state.labels[s]+' : « '+m.name+' » : cumul inférieur à la semaine précédente.');});});
  if(WKL()>=state.plan.k)errs.push('Durée prévue atteinte ('+state.plan.k+' semaines).');
  if(errs.length){ui.error=errs.slice(0,6).join(' ');return render();}
  state.weeks.push(W);ui.manual=false;ui.manFlow=false;ui.mw={};ui.man.step=1;ui.week=null;ui.error='';ui.tab='resultats';autosave();ensureBounds();render();
}

root.addEventListener('change',function(e){
  if(ACC.sync)return;

    else{var keep={name:d.name,k:d.k,tt:d.tt,startDate:d.startDate,endDate:d.endDate,endSrc:d.endSrc,startSrc:d.startSrc,endTyped:d.endTyped,endOk:d.endOk,cTest:d.cTest,cVar:d.cVar,cVis:d.cVis,test:d.test,control:d.control,variant:d.variant},old=d.metrics,sg=d.startGuess;

      if(f==='test'){keep.k=null;keep.startDate=null;keep.name=d.name===d.test?t.value:d.name;}

      ui.draft.metrics.forEach(function(m){var o=old.filter(function(x){return x.src===m.src;})[0];if(o){m.include=o.include;m.role=o.role;m.sens=o.sens;m.name=o.name;}});
      if(!state.weeks.length&&!ui.draft.metrics.some(function(m){return m.include&&m.role==='principale';})){var fm=ui.draft.metrics.filter(function(m){return m.include&&m.type!=='continue';})[0];if(fm)fm.role='principale';}}

    return later();}
  if(t.hasAttribute('data-p')&&ui.planDraft){var k=t.getAttribute('data-p');if(k==='unit'&&t.value!==(ui.planDraft.unit||'semaine')){ui.planDraft.k=t.value==='jour'?Math.min(50,ui.planDraft.k*7):Math.max(1,Math.round(ui.planDraft.k/7));}ui.planDraft[k]=(k==='startDate'||k==='sfu'||k==='sfl'||k==='unit')?t.value:(k==='k'||k==='testType'?parseInt(t.value,10):parseFloat(t.value));return later();}
  if(t.hasAttribute('data-m')){var mm=state.metrics[+t.getAttribute('data-i')],q=t.getAttribute('data-m');
    if(q==='role'&&state.weeks.length&&!confirm('Changer le rôle d\'une métrique après avoir vu les résultats fausse la lecture du test. À réserver à la correction d\'une erreur. Continuer ?'))return later();
    mm[q]=q==='marge'?(parseFloat(t.value)>0?parseFloat(t.value):1):(q==='name'?(t.value.trim()||mm.name):t.value);
    if(q==='role'&&t.value==='principale')state.metrics.forEach(function(x){if(x!==mm&&x.role==='principale')x.role='secondaire';});
    autosave();if(q==='role')ensureBounds();return later();}
  if(t.hasAttribute('data-man')){var mk=t.getAttribute('data-man'),mx=/^m(\d)(name|role)$/.exec(mk);if(mx)ui.man.ms[+mx[1]][mx[2]]=t.value;else if(mk==='alpha'||mk==='power'){ui.man[mk]=parseFloat(t.value);return later();}else if(mk==='testType'){ui.man.testType=t.value==='1'?1:3;return later();}else ui.man[mk]=t.value;return;}
  if(t.getAttribute('data-f')==='accemail'){ACC.email=t.value;return;}
  if(t.getAttribute('data-f')==='invite'){ACC.invite=t.value;return;}

});
