      +'</tbody></table></div></div>';}
  return h;
}
function softRender(){var a=document.activeElement;if(a&&root.contains(a)&&a.tagName==='INPUT'&&a.type!=='radio'&&a.type!=='checkbox'){setTimeout(softRender,700);return;}render();}
function needIF(p,k){
  if(k===1)return 1;var q=Object.assign({},p,{k:k,beta:parseFloat((1-p.power).toFixed(4))}),key=planKey(q);
  if(typeof ui.ifc[key]==='number')return ui.ifc[key];
  if(ui.ifc[key]===undefined){ui.ifc[key]=null;fetchBounds(q).then(function(b){ui.ifc[key]=b.IF;}).catch(function(){ui.ifc[key]=false;}).then(function(){if(ui.tab==='plan')softRender();});}
  return ui.ifc[key];
}
function mdeBase(){
  var t=toNum(ui.mde.traffic),c=toNum(ui.mde.conv);
  if(!(t>0)&&state.weeks.length){var w=state.weeks[state.weeks.length-1],pm=state.metrics.filter(function(m){return m.role==='principale'&&m.type!=='continue';})[0];
    if(pm&&w.A.m[pm.id]){t=Math.round((w.A.n+w.B.n)/state.weeks.length);c=Math.round((w.A.m[pm.id].c+w.B.m[pm.id].c)/state.weeks.length);ui.mde.traffic=String(t);ui.mde.conv=String(c);ui.mde.auto=true;}}
  return (t>0&&c>0&&c<t)?{t:t,p:c/t}:null;
}
function mdeAt(p,base,w){return (normInv(1-p.alpha)+normInv(p.power))*Math.sqrt(2*base.p*(1-base.p)/(base.t*w/2))/base.p;}
function viewPlan(){
  var p=ui.planDraft||(ui.planDraft=JSON.parse(JSON.stringify(state.plan))),sel=function(v,opts){return opts.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(v)?' selected':'')+'>'+o[1]+'</option>';}).join('');};
  var dirty=planKey(p)!==planKey(state.plan)||p.startDate!==state.plan.startDate,base=mdeBase();
  var h='<div class="card pcard"><div class="phead"><span class="n">01</span><div><h3>Durée du test et effet détectable</h3><span class="hint">Réglez la durée, lisez tout de suite ce que le test pourra démontrer.</span></div></div><div class="psplit"><div class="pform">'
    +'<div class="form2"><div><label>Trafic par semaine (A + B)</label><input inputmode="numeric" data-mde="traffic" value="'+esc(ui.mde.traffic)+'" placeholder="ex. 20 000"></div><div><label>Conversions par semaine</label><input inputmode="numeric" data-mde="conv" value="'+esc(ui.mde.conv)+'" placeholder="ex. 1 000"></div></div>'
    +(ui.mde.auto?'<span class="hint">Pré-rempli depuis vos données importées (métrique principale). Modifiable.</span>':'')
    +'<div class="form2"><div><label>Durée prévue (semaines)</label><input type="number" min="1" max="50" data-p="k" value="'+p.k+'"></div><div><label>Date de début</label><input type="date" data-p="startDate" value="'+esc(p.startDate)+'"></div>'
    +'<div><label>Confiance</label><select data-p="alpha">'+sel(p.alpha,[[0.2,'80 %'],[0.15,'85 %'],[0.1,'90 %'],[0.05,'95 %'],[0.01,'99 %']])+'</select></div><div><label>Puissance</label><select data-p="power">'+sel(p.power,[[0.6,'60 %'],[0.7,'70 %'],[0.8,'80 %'],[0.85,'85 %'],[0.9,'90 %'],[0.95,'95 %']])+'</select></div></div>'
    +'<div><label>Quand le test peut-il s\'arrêter avant la fin ?</label>'
    +'<label class="opt'+(p.testType===3?' on':'')+'"><input type="radio" name="gst-tt" data-p="testType" value="3"'+(p.testType===3?' checked':'')+'><span><b>Dès qu\'il gagne, ou dès qu\'il n\'a plus de chances de gagner</b> · recommandé<br><span class="hint">Vous libérez le trafic des tests sans avenir. Contrepartie : il faut respecter l\'arrêt quand l\'outil le demande.</span></span></label>'
    +'<label class="opt'+(p.testType===1?' on':'')+'"><input type="radio" name="gst-tt" data-p="testType" value="1"'+(p.testType===1?' checked':'')+'><span><b>Seulement dès qu\'il gagne</b><br><span class="hint">Sinon le test va jusqu\'au bout de la durée prévue. À choisir si vous voulez toutes les données, même sur un test neutre.</span></span></label></div>'
    +(ui.adv?'<div class="form2"><div><label>Dépense du risque α (efficacité)</label><select data-p="sfu">'+sel(p.sfu,[['KimDeMets','Kim-DeMets (ρ = 3)'],['OF','O\'Brien-Fleming']])+'</select></div><div><label>Dépense du risque β (futilité)</label><select data-p="sfl">'+sel(p.sfl,[['HSD','HSD (γ = −2)'],['KimDeMets','Kim-DeMets (ρ = 3)'],['OF','O\'Brien-Fleming']])+'</select></div></div>':'')
    +'<p class="row"><button type="button" class="pri" data-act="applyplan"'+(dirty?'':' disabled')+'>Appliquer le plan</button><button type="button" class="link" data-act="adv">'+(ui.adv?'Masquer les':'Afficher les')+' réglages avancés</button></p></div><div class="pmde">';
  h+='<div class="kicker" style="color:#015c45">Ce que ce plan peut démontrer</div>';
  if(!base)h+='<p>Renseignez le trafic et les conversions par semaine pour connaître le plus petit effet que ce test pourra démontrer.</p>';
  else{
    var IF=needIF(p,p.k),fix=mdeAt(p,base,p.k),seq=typeof IF==='number'?fix*Math.sqrt(IF):null,val=seq||fix;
    h+='<div class="mdebig"><span class="num">'+nf(val*100,2)+' %</span><span><b>Effet minimal détectable</b><br>en '+p.k+' semaine'+(p.k>1?'s':'')+' de test'+(seq?'':' <span class="hint">('+(IF===false?'horizon fixe, calcul séquentiel indisponible':'calcul séquentiel en cours…')+')</span>')+'</span></div>'
      +'<p>Si la variante fait passer le taux de <b>'+nf(base.p*100,2)+' % à '+nf(base.p*(1+val)*100,2)+' %</b> ou plus, ce test a <b>'+nf(p.power*100,0)+' % de chances</b> de le démontrer. En dessous, il finira le plus souvent non concluant.</p>'
      +(seq&&IF>1.0005?'<p class="hint">Dont '+pct(Math.sqrt(IF)-1,1)+' dus au suivi chaque semaine : le même test lu une seule fois à la fin détecterait '+nf(fix*100,2)+' %.</p>':'');
    var ks=[2,4,6,8,10,12,p.k].filter(function(v,i,a){return v>=1&&v<=50&&a.indexOf(v)===i;}).sort(function(a,b){return a-b;}),rows=ks.map(function(w){var f=needIF(p,w),v=mdeAt(p,base,w);return {w:w,ok:typeof f==='number',v:typeof f==='number'?v*Math.sqrt(f):v};}),mxv=Math.max.apply(null,rows.map(function(r){return r.v;}));
    h+='<div class="mdetab"><div class="mh">Et avec une autre durée ?</div>'+rows.map(function(r){return '<button type="button" class="mr2'+(r.w===p.k?' on':'')+'" data-act="pickk" data-v="'+r.w+'"><span>'+r.w+' semaine'+(r.w>1?'s':'')+'</span><span class="b"><i style="width:'+Math.max(4,r.v/mxv*100)+'%"></i></span><b class="num">'+(r.ok?'':'≈ ')+nf(r.v*100,2)+' %</b></button>';}).join('')+'</div><span class="hint">« ≈ » : valeur à horizon fixe, remplacée dès que le calcul séquentiel répond. Cliquez une durée pour la retenir.</span>';
  }
  h+='</div></div></div>';
  h+='<div class="card pcard"><div class="phead"><span class="n">02</span><div><h3>Métriques suivies <span class="hint">· '+state.metrics.length+' sur '+MAX_METRICS+'</span></h3><span class="hint">Une principale décide, les garde-fous peuvent bloquer, les secondaires informent.</span></div></div>'
    +(state.metrics.length?'<div class="scroll"><div class="mtab"><div class="mt h"><span>Nom affiché</span><span>Type</span><span>Rôle</span><span>Sens favorable</span><span>Marge tolérée</span></div>'
      +state.metrics.map(function(m,i){return '<div class="mt'+(m.role==='principale'?' on':'')+'"><input data-m="name" data-i="'+i+'" value="'+esc(m.name)+'" aria-label="Nom affiché"><span class="hint">'+(m.type==='continue'?'Moyenne':'Taux')+'</span>'
        +'<select data-m="role" data-i="'+i+'" aria-label="Rôle">'+sel(m.role,[['principale','Principale'],['garde-fou','Garde-fou'],['secondaire','Secondaire']])+'</select>'
        +'<select data-m="sens" data-i="'+i+'" aria-label="Sens favorable">'+sel(m.sens,[['hausse','Hausse'],['baisse','Baisse']])+'</select>'
        +(m.role==='garde-fou'?'<input type="number" min="0.1" max="20" step="0.1" data-m="marge" data-i="'+i+'" value="'+m.marge+'" aria-label="Marge tolérée en %">':'<span class="hint">—</span>')+'</div>';}).join('')
      +'</div></div><p class="hint" style="padding:12px 20px 0">Marge tolérée : dégradation relative maximale acceptée pour un garde-fou (en %). Changer un rôle après avoir vu les résultats fausse la lecture du test : l\'outil demande une confirmation.</p>'
      :'<p class="hint" style="padding:16px 20px 0">Les métriques sont créées à l\'import du fichier (onglet Données).</p>')+'</div>';
  return h;
}
function render(){
  var a=document.activeElement,fsel='';
  if(a&&root.contains(a)&&a!==root)['data-f','data-d','data-dm','data-p','data-m','data-mde','data-i','data-act','data-v'].forEach(function(k){if(a.hasAttribute(k))fsel+='['+k+'="'+a.getAttribute(k)+'"]';});
  root.innerHTML=head()+(ui.tab==='donnees'?viewData():ui.tab==='plan'?viewPlan():viewResults())+'<div class="foot"><span>Analyse séquentielle par groupes (gsDesign) · '+VERSION+'</span><span class="logo"><b>FWO</b>ptimisation</span></div>';
  drawCharts();
  if(fsel){var el=null;try{el=root.querySelector(fsel);}catch(e){}if(el&&!el.disabled)el.focus({preventScroll:true});}
}
function drawCharts(){
  var el=root.querySelector('[data-chart]');if(!el||!state.bounds)return;
  var m=state.metrics.filter(function(x){return x.id===el.getAttribute('data-chart');})[0];if(!m)return;
  el.innerHTML=seqChart(m,compute(),+el.getAttribute('data-cur'),Math.max(260,Math.floor(el.clientWidth)));
}
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(drawCharts,150);});

/* ---------- événements ---------- */
function act(name,v,el){
  ui.notice='';
  if(name==='tab'){ui.tab=v;ui.error='';if(v!=='plan')ui.planDraft=null;}
  else if(name==='pick'){var fi=root.querySelector('[data-f=file]');if(fi)fi.click();return;}
  else if(name==='example'){openDraft(EXEMPLE,'exemple-7-metriques.csv');if(ui.draft){ui.draft.k=8;ui.draft.name='Exemple — 7 métriques';render();}return;}
  else if(name==='template'){return download('modele-import-sequentiel.csv',toCSV([['Semaine','Date de début','Date de fin','Variation','Visiteurs','Visiteurs convertis (principal)','Visiteurs avec rebond','CA (€) [somme]','CA (€) [somme carrés]'],['1','2026-01-05','2026-01-11','A - Contrôle','','','','',''],['1','2026-01-05','2026-01-11','B - Variante','','','','','']]));}
  else if(name==='export'){var rows=[['Semaine','Variation','Visiteurs'].concat([].concat.apply([],state.metrics.map(function(m){return m.type==='continue'?[m.name+' [somme]',m.name+' [somme carrés]']:[m.name];})))];
    state.weeks.forEach(function(w,i){['A','B'].forEach(function(s){rows.push([i+1,state.labels[s],w[s].n].concat([].concat.apply([],state.metrics.map(function(m){var x=w[s].m[m.id]||{};return m.type==='continue'?[String(x.s).replace('.',','),String(x.ss).replace('.',',')]:[x.c];}))));});});
    return download((state.name||'test')+'-donnees.csv',toCSV(rows));}
  else if(name==='apply'){return applyDraft();}
  else if(name==='cancel'){ui.draft=null;}
  else if(name==='week'){ui.week=+v;}
  else if(name==='legend'){ui.legend=!ui.legend;}
  else if(name==='detail'){ui.detail=!ui.detail;}
  else if(name==='unit'){ui.unit=v;}
  else if(name==='howto'){ui.howto=v;}
  else if(name==='sel'){ui.sel=v;}
  else if(name==='manual'){ui.manual=!ui.manual;}
  else if(name==='adv'){ui.adv=!ui.adv;}
  else if(name==='pickk'){if(ui.planDraft)ui.planDraft.k=+v;}
  else if(name==='delweek'){if(!confirm('Supprimer les données de la semaine '+state.weeks.length+' ?'))return;state.weeks.pop();ui.week=null;autosave();}
  else if(name==='addweek'){return addManual();}
  else if(name==='save'){if(!state.name.trim()){ui.error='Donnez un nom au test avant de l\'enregistrer.';}else{autosave();if(!ui.error)ui.notice='Test « '+state.name+' » enregistré dans ce navigateur.';}}
  else if(name==='new'){if(state.weeks.length&&!confirm('Démarrer un nouveau test ? Les données non enregistrées seront perdues.'))return;state=freshState();ui.week=null;ui.sel=null;ui.draft=null;ui.planDraft=null;ui.error='';ui.tab='resultats';}
  else if(name==='applyplan'){var p=ui.planDraft;if(!(p.k>=1&&p.k<=50)){ui.error='Durée invalide (1 à 50 semaines).';return render();}
    if(p.k<state.weeks.length){ui.error='La durée ('+p.k+') est inférieure au nombre de semaines déjà saisies ('+state.weeks.length+').';return render();}
    if(state.weeks.length&&planKey(p)!==planKey(state.plan)&&!confirm('Modifier le plan recalcule les bornes sur les données déjà saisies. À réserver à la correction d\'une erreur de paramétrage. Continuer ?'))return;
    p.beta=parseFloat((1-p.power).toFixed(4));state.plan=p;ui.planDraft=null;ui.error='';ui.notice='Plan appliqué.';autosave();ensureBounds();}
  render();
}
function addManual(){
  var W={A:{n:NaN,m:{}},B:{n:NaN,m:{}}},errs=[];
  root.querySelectorAll('[data-mw]').forEach(function(i){var k=i.getAttribute('data-mw').split('|'),v=toNum(i.value);if(k[1]==='n')W[k[0]].n=v;else{(W[k[0]].m[k[1]]=W[k[0]].m[k[1]]||{})[k[2]]=v;}});
  var prev=state.weeks[state.weeks.length-1];
  ['A','B'].forEach(function(s){var o=W[s];if(!(o.n>0)||o.n!==Math.round(o.n))errs.push(state.labels[s]+' : visiteurs invalides.');if(prev&&o.n<prev[s].n)errs.push(state.labels[s]+' : visiteurs cumulés inférieurs à la semaine précédente.');
    state.metrics.forEach(function(m){var x=o.m[m.id]||{};if(m.type==='continue'){if(!isFinite(x.s)||!isFinite(x.ss))errs.push(state.labels[s]+' — « '+m.name+' » : valeurs manquantes.');}
      else if(!(x.c>=0)||x.c!==Math.round(x.c))errs.push(state.labels[s]+' — « '+m.name+' » : valeur invalide.');else if(x.c>o.n)errs.push(state.labels[s]+' — « '+m.name+' » dépasse les visiteurs.');else if(prev&&x.c<prev[s].m[m.id].c)errs.push(state.labels[s]+' — « '+m.name+' » : cumul inférieur à la semaine précédente.');});});
  if(state.weeks.length>=state.plan.k)errs.push('Durée prévue atteinte ('+state.plan.k+' semaines).');
  if(errs.length){ui.error=errs.slice(0,6).join(' ');return render();}
  state.weeks.push(W);ui.manual=false;ui.week=null;ui.error='';ui.tab='resultats';autosave();ensureBounds();render();
}
root.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||!root.contains(t)||t.tagName==='SELECT'||e.target.closest('select'))return;if(t.disabled)return;e.stopPropagation();act(t.getAttribute('data-act'),t.getAttribute('data-v'),t);});
root.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][tabindex]')){e.preventDefault();act(e.target.getAttribute('data-act'),e.target.getAttribute('data-v'),e.target);}});

root.addEventListener('change',function(e){
  var t=e.target,d=ui.draft;
  if(t.matches('[data-f=file]')){if(t.files[0])readFile(t.files[0]);return;}
  if(t.matches('[data-f=name]')){state.name=t.value.trim();return;}

  if(t.hasAttribute('data-d')&&d){var f=t.getAttribute('data-d');
    if(f==='cumulate')d.cumulate=t.checked;else if(f==='name')d.name=t.value;else if(f==='k')d.k=parseInt(t.value,10)||d.k;else if(f==='startDate')d.startDate=t.value;
    else{var keep={name:d.name,k:d.k,startDate:d.startDate,cVar:d.cVar,cVis:d.cVis,test:d.test,control:d.control,variant:d.variant},old=d.metrics,cum=d.cumulate;
      if(f==='cVar'||f==='cVis'){keep[f]=parseInt(t.value,10);if(f==='cVar'){keep.control=null;keep.variant=null;}}else keep[f]=t.value;
      if(f==='test'){keep.k=null;keep.startDate=null;keep.name=d.name===d.test?t.value:d.name;}
      ui.draft=analyze(ui.rawTable,d.file,keep);ui.draft.cumulate=cum;
      ui.draft.metrics.forEach(function(m){var o=old.filter(function(x){return x.src===m.src;})[0];if(o){m.include=o.include;m.role=o.role;m.sens=o.sens;m.name=o.name;}});}
    return later();}
  if(t.hasAttribute('data-dm')&&d){var m=d.metrics[+t.getAttribute('data-i')],g=t.getAttribute('data-dm');
    if(g==='include')m.include=t.checked;else m[g]=t.value;
    if(g==='role'&&t.value==='principale')d.metrics.forEach(function(x){if(x!==m&&x.role==='principale')x.role='secondaire';});
    return later();}
  if(t.hasAttribute('data-p')&&ui.planDraft){var k=t.getAttribute('data-p');ui.planDraft[k]=(k==='startDate'||k==='sfu'||k==='sfl')?t.value:(k==='k'||k==='testType'?parseInt(t.value,10):parseFloat(t.value));return later();}
  if(t.hasAttribute('data-m')){var mm=state.metrics[+t.getAttribute('data-i')],q=t.getAttribute('data-m');
    if(q==='role'&&state.weeks.length&&!confirm('Changer le rôle d\'une métrique après avoir vu les résultats fausse la lecture du test. À réserver à la correction d\'une erreur. Continuer ?'))return later();
    mm[q]=q==='marge'?(parseFloat(t.value)>0?parseFloat(t.value):1):(q==='name'?(t.value.trim()||mm.name):t.value);
    if(q==='role'&&t.value==='principale')state.metrics.forEach(function(x){if(x!==mm&&x.role==='principale')x.role='secondaire';});
    autosave();if(q==='role')ensureBounds();return later();}
  if(t.hasAttribute('data-mde')){ui.mde[t.getAttribute('data-mde')]=t.value;ui.mde.auto=false;return later();}
});
root.addEventListener('dragover',function(e){var z=e.target.closest('.drop');if(z){e.preventDefault();z.classList.add('over');}});
root.addEventListener('dragleave',function(e){var z=e.target.closest('.drop');if(z)z.classList.remove('over');});
root.addEventListener('drop',function(e){var z=e.target.closest('.drop');if(!z)return;e.preventDefault();z.classList.remove('over');var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f);});
window.GST={getState:function(){return state;},compute:compute,openCSV:openDraft};
render();
})();
</script>
